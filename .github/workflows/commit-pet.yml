name: Commit Pet

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  commit-pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yukurash/commit-pet@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: Ceihiro
          name: "sora"
